name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub release
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm with trusted publishing
        run: npm install -g npm@^11.5.1
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - name: Tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          case "$VERSION" in
            *-*) echo "NPM_TAG=next" >> "$GITHUB_ENV"; echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" ;;
            *)   echo "NPM_TAG=latest" >> "$GITHUB_ENV"; echo "PRERELEASE=" >> "$GITHUB_ENV" ;;
          esac
      - run: npm run check:gen
      - run: npm test
      - run: npm run build
      - name: Compile standalone binaries
        run: |
          npm run compile
          ./dist-bin/xcrepro-darwin-arm64 --version
      - name: Publish to npm
        run: npm publish --access public --tag "$NPM_TAG"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-bin/* --verify-tag --generate-notes $PRERELEASE
